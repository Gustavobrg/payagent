name: evals
on: [push, pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      # TODO(bloco 9): evals/harness/run.py ainda nao existe. Reativar este step
      # (uv run python -m evals.harness.run --fail-on-regression) quando o harness
      # for implementado - ele deve sair com codigo != 0 se false_settlement_rate > 0
      # ou pan_leak_count > 0.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/
