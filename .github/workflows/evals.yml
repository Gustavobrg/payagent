name: evals
on: [push, pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Gate: implementado no bloco 9.
      # O harness sai com codigo != 0 se false_settlement_rate > 0 ou pan_leak_count > 0.
      - run: python -m evals.harness.run --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/
