# Infra local para dev. Langfuse usa a versão cloud (ver .env.example) — não é
# self-hosted aqui. Llama Guard roda via Ollama no host, fora deste compose
# (ver "uv run python scripts/probe_llama_guard.py" no CLAUDE.md).
services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
